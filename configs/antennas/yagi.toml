# configs/antennas/yagi.toml -- Yagi-Uda antenna for 21 cm
# Version 0.2.0 (2026-10-12): typical example values filled in (long Yagi of
#   the DL6WU type, about 4 wavelengths boom); decided by E. Schubert to use
#   typical values until the data sheet of the actual antenna is available.
# Version 0.1.0 (2026-10-12): template with "nan" values.
# The values are to be taken from the data sheet / design of the actual
# antenna; replace the example values below as soon as they are known.
name = "Yagi 13 el. (example)"
type = "yagi"
n_elements = 13             # number of elements (reflector + driven + directors)
boom_length_m = 0.85        # boom length (about 4 lambda at 21 cm)
gain_dbi = 15.0             # gain at the design frequency (typical for 4 lambda boom)
design_freq_hz = 1.4204e9   # HI line; for OH masers 1.6654e9 / 1.6674e9
polarisation = "linear"
