# binder/environment.yml -- environment for Binder / JupyterHub
# Version 0.1.1 (2026-10-12): package installed by postBuild instead of
#   'pip -e ..' (relative path not reliable); untested on mybinder.org
name: interferosim
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.24
  - scipy>=1.10
  - astropy>=5.0
  - matplotlib>=3.7
  - ipywidgets>=8
  - jupyterlab
  - ipykernel
  - nbformat
  - pytest
  - pip
# the package itself is installed by binder/postBuild (pip install -e .)
