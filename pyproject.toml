# pyproject.toml -- package definition of interferosim
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interferosim"
version = "0.9.6"
description = "Open-source simulator for radio interferometry with interactive teaching notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
authors = [{name = "Erich Schubert"}]
# Same base dependencies as aas6sim 1.1.0, plus matplotlib for plotting.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipywidgets>=8", "ipykernel"]
test = ["pytest>=7", "nbval"]
docs = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton"]

[project.scripts]
interferosim-sky = "interferosim.sky.cli:main"
interferosim-hello = "interferosim.hello:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interferosim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
